<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="description" content="Glow — Sacred Geometry Rhythm Game">
  <link rel="manifest" href="./manifest.json">
  <title>☀️ Glow</title>
  <style>
    :root {
      --c-bg: oklch(0.12 0.02 260);
      --c-surface: oklch(0.17 0.02 260);
      --c-text: oklch(0.92 0.01 260);
      --c-accent: oklch(0.62 0.18 240);
      --c-success: oklch(0.62 0.20 145);
      --c-danger: oklch(0.52 0.22 25);
      --touch-target: 44px;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
